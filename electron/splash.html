<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>Skill Manager</title>
<style>
  /* Заставка, пока стартует сервер: те же фон и палитра, что у интерфейса (src/app/globals.css). */
  :root {
    --bg-1: #12071f;
    --bg-2: #3a1060;
    --bg-3: #0c1538;
    --text: #eef0ff;
    --text-dim: rgba(238, 240, 255, 0.62);
    --blue: #3d5bff;
    --violet: #9d4dff;
    --pink: #f070e6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    background-color: var(--bg-1);
    background-image:
      radial-gradient(ellipse 70% 80% at 20% 85%, rgba(122, 30, 160, 0.55), transparent 60%),
      radial-gradient(ellipse 60% 70% at 85% 15%, rgba(20, 40, 120, 0.55), transparent 60%),
      linear-gradient(120deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  /* Зерно поверх фона, как в приложении */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    animation: splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* Светящееся кольцо — упрощённая капля из интерфейса */
  .splash__orb {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, rgba(40, 60, 160, 0.55), rgba(20, 24, 80, 0.35) 62%, transparent 72%);
    animation: orb-breathe 3.2s ease-in-out infinite;
  }
  .splash__orb::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, var(--blue), var(--violet), var(--pink), var(--blue));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    filter: drop-shadow(0 0 10px rgba(157, 77, 255, 0.85)) drop-shadow(0 0 26px rgba(61, 91, 255, 0.55));
    animation: orb-spin 4s linear infinite;
  }
  .splash__orb::after {
    content: "";
    position: absolute;
    inset: -28px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(157, 77, 255, 0.28), transparent 65%);
    filter: blur(6px);
  }

  .splash__title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, #fff, var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .splash__status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .splash__bar {
    position: relative;
    width: 180px;
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
  }
  .splash__bar::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--violet), var(--pink), transparent);
    animation: bar-run 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  @keyframes splash-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes orb-spin { to { transform: rotate(360deg); } }
  @keyframes orb-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes bar-run { from { left: -40%; } to { left: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .splash, .splash__orb, .splash__orb::before, .splash__bar::before { animation: none; }
    .splash__bar::before { left: 30%; }
  }
</style>
</head>
<body>
  <main class="splash" aria-busy="true" aria-live="polite">
    <div class="splash__orb" aria-hidden="true"></div>
    <h1 class="splash__title">Skill Manager</h1>
    <div class="splash__status">
      <div class="splash__bar" aria-hidden="true"></div>
      <span>Запускаю…</span>
    </div>
  </main>
</body>
</html>
