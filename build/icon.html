<!doctype html>
<!-- Источник иконки: node scripts/make-icon.mjs рендерит его в build/icon.png и build/icon.ico -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12071f"/>
      <stop offset="0.5" stop-color="#3a1060"/>
      <stop offset="1" stop-color="#0c1538"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.22" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#7a1ea0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7a1ea0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#14287a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#14287a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blob" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#3d5bff"/>
      <stop offset="0.52" stop-color="#9d4dff"/>
      <stop offset="1" stop-color="#f070e6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.36" cy="0.28" r="0.42">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.62" cy="0.72" r="0.55">
      <stop offset="0.55" stop-color="#12071f" stop-opacity="0"/>
      <stop offset="1" stop-color="#12071f" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glowViolet)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glowBlue)"/>

    <!-- свечение под каплей -->
    <path filter="url(#soft)" opacity="0.75" fill="url(#blob)"
      d="M256 104c70 0 136 44 146 116 11 76-38 160-118 180-82 21-170-28-182-112-12-82 72-184 154-184z"/>
    <!-- стеклянная капля -->
    <path fill="url(#blob)"
      d="M256 104c70 0 136 44 146 116 11 76-38 160-118 180-82 21-170-28-182-112-12-82 72-184 154-184z"/>
    <path fill="url(#depth)"
      d="M256 104c70 0 136 44 146 116 11 76-38 160-118 180-82 21-170-28-182-112-12-82 72-184 154-184z"/>
    <path fill="url(#shine)"
      d="M256 104c70 0 136 44 146 116 11 76-38 160-118 180-82 21-170-28-182-112-12-82 72-184 154-184z"/>
    <ellipse cx="206" cy="172" rx="46" ry="24" fill="#ffffff" opacity="0.55" transform="rotate(-28 206 172)"/>
    <path fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"
      d="M256 104c70 0 136 44 146 116 11 76-38 160-118 180-82 21-170-28-182-112-12-82 72-184 154-184z"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
</svg>
</body>
</html>
