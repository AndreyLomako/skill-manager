name: Release

# Тег vX.Y.Z (`npm version minor` + `git push --follow-tags`).
# 1) create: проверяет, что тег совпадает с версией в package.json, и один раз создаёт черновик релиза
#    (electron-builder ищет релиз по v<версия>; без него три сборки создали бы по своему черновику);
# 2) build: каждая ОС собирает свои файлы, electron-builder докладывает их и latest*.yml в этот черновик;
# 3) publish: когда все сборки успешны и все latest*.yml на месте, черновик публикуется.
# Пред-релизы (v1.0.0-beta.1) сюда не попадают: клиенты их не понимают.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в package.json ($version)"
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # При повторном запуске черновик уже есть — второй не создаём.
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Skill Manager $GITHUB_REF_NAME"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Без latest*.yml клиенты не найдут обновление — такой релиз не публикуем.
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            if ! printf '%s\n' "$assets" | grep -qx "$f"; then
              echo "::error::В черновике $GITHUB_REF_NAME нет $f"
              exit 1
            fi
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
